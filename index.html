<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Gallery</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 50px;
            scroll-behavior: smooth;
        }

        /* Khung hiển thị ảnh */
        #image {
            width: 11cm;
            height: 16cm;
            border: 2px solid #333;
            margin: auto;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* Ảnh thumbnail mặc định (Mobile) */
        img {
            width: 90%;
            height: auto;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
        }

        img:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        /* Container chứa các ảnh */
        #gallery-container {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        /* ------------------------------------------------------ */
        /* Tablet: 2 cột */
        /* ------------------------------------------------------ */
        @media (min-width: 772px) {

            #image {
                width: 45vw;
            }

            #gallery-container img {
                width: 45%;
                height: auto;
                max-width: none;
            }
        }

        /* ------------------------------------------------------ */
        /* Desktop: 3 cột */
        /* ------------------------------------------------------ */
        @media (min-width: 998px) {

            #image {
                width: 30vw;
            }

            #gallery-container img {
                width: 30%;
                margin: 10px 0.5%;
                max-width: none;
            }
        }

    </style>
</head>

<body>

    <h1>Movie Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <br>

    <div id="gallery-container">
        <img src="interstellar.jpg" alt="Interstellar"
             onmouseover="upDate(this)" 
             onmouseout="undo()">

        <img src="peaky.jpg" alt="Peaky Blinders"
             onmouseover="upDate(this)" 
             onmouseout="undo()">

        <img src="breakingbad.jpg" alt="Breaking Bad"
             onmouseover="upDate(this)" 
             onmouseout="undo()">
    </div>

    <script>
        function upDate(previewPic) {
            document.getElementById("image").innerHTML = previewPic.alt;
            document.getElementById("image").style.backgroundImage =
                "url('" + previewPic.src + "')";
        }

        function undo() {
            document.getElementById("image").innerHTML =
                "Hover over an image below to display here.";
            document.getElementById("image").style.backgroundImage = "";
        }
    </script>

</body>
</html>
