<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Movie Gallery</title>
        <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 50px;
      scroll-behavior: smooth;
    }
    /* Thiết lập #image ban đầu */
    #image {
        width: 11cm;
        height: 16cm;
        border: 2px solid #333;
        margin: auto;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
    }
    
    /* Thiết lập img ban đầu (Áp dụng cải tiến Responsive cho Mobile) */
    img {
        /* Thay width cố định bằng width linh hoạt, tránh tràn màn hình */
        width: 80%;
        max-width: 200px; /* Giới hạn tối đa 200px */
        height: fit-content;
        margin: 10px 5px; /* Giảm margin ngang */
        cursor: pointer;
        border-radius: 8px;
        transition: 0.2s;
    }
    img:hover {
        transform: scale(1.1);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* Thiết lập Container cho ảnh Thumbnail (Mobile View - 1 Cột) */
    #gallery-container {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap; 
        justify-content: center; 
        margin-top: 20px;
    }

/* ---------------------------------------------------------------------- */
/* --- Query #1: Tablet View (min-width: 772px) - 2 Cột --- */
/* ---------------------------------------------------------------------- */
@media (min-width: 772px) {
    /* Thay đổi #image (div) thành 45% viewport width */
    #image {
        width: 45vw;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* Thay đổi ảnh thumbnail: max-height 30vh và bố cục 2 cột */
    #gallery-container img {
        max-height: 30vh;
        height: auto; 
        /* Đặt width khoảng 45% để 2 ảnh vừa vặn trên 1 hàng (2 cột) */
        width: 45%; 
        margin: 10px 0; 
        max-width: none; /* Loại bỏ giới hạn max-width 200px khi ở tablet view */
    }
}

/* ---------------------------------------------------------------------- */
/* --- Query #2: Large Screen View (min-width: 998px) - 3 Cột --- */
/* ---------------------------------------------------------------------- */
@media (min-width: 998px) {
    /* Thay đổi #image (div) thành 30% viewport width */
    #image {
        width: 30vw;
    }

    /* Thay đổi ảnh thumbnail: bố cục 3 cột */
    #gallery-container img {
        /* Đặt width khoảng 30% để 3 ảnh vừa vặn trên 1 hàng (3 cột) */
        width: 30%;
        margin: 10px 0.5%; 
    }
}
  </style>
    </head>

    <body>
        <h1>Movie Gallery</h1>
        <div id="image">
        Hover over an image below to display here.
        </div>
        <br>
        <img src="interstellar.jpg" alt="Interstellar" 
             onmouseover="upDate(this)" 
             onmouseout="undo()">
        <img src="peaky.jpg" alt="Peaky Blinders"
             onmouseover="upDate(this)" 
             onmouseout="undo()">
        <img src="breakingbad.jpg" alt="Breaking Bad"
             onmouseover="upDate(this)" 
             onmouseout="undo()">
        <script>
            function upDate(previewPic) {
                console.log(previewPic.src);
                console.log(previewPic.alt);

                document.getElementById("image").innerHTML = previewPic.alt;
                document.getElementById("image").style.backgroundImage ="url('" + previewPic.src + "')";
        }

        function undo() {
            document.getElementById("image").innerHTML ="Hover over an image below to display here.";
            document.getElementById("image").style.backgroundImage = "url('')";
        }
        </script>
    </body>
</html>
