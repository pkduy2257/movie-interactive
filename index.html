<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Gallery</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    margin: 50px;
    scroll-behavior: smooth;
}

/* Khung hiển thị ảnh lớn (#image) */
#image {
    width: 12rem;
    height: 18rem; /* Tỉ lệ 2:3 */
    border: 2px solid #333;
    margin: auto;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: bold;
    transition: background-image 0.3s ease;
}

/* Container chứa các thumbnail */
#gallery-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    margin: 20px auto 0 auto;
    gap: 10px;
    max-width: 1100px;
}

/* Thumbnail ảnh (Mobile - 1 cột) */
#gallery-container img {
    width: 80%; 
    max-width: 200px; 
    height: calc(80% * 1.5); /* giữ tỉ lệ 2:3 */
    object-fit: cover;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 0.2s, box-shadow 0.2s;
}

#gallery-container img:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}

/* Tablet - 2 cột */
@media (min-width: 772px) {
    #image {
        width: 18rem;
        height: 27rem;
    }

    #gallery-container img {
        width: calc(50% - 15px);
        height: calc((50% - 15px) * 1.5); /* 2:3 */
        max-width: 250px;
    }
}

/* Desktop - 3 cột */
@media (min-width: 998px) {
    #image {
        width: 20rem;
        height: 30rem;
    }

    #gallery-container img {
        width: calc(33.333% - 13px);
        height: calc((33.333% - 13px) * 1.5); /* 2:3 */
        max-width: 300px;
    }
}
</style>
</head>

<body>
<h1>Movie Gallery</h1>

<div id="image">
    Hover over an image below to display here.
</div>

<div id="gallery-container">
    <img src="interstellar.jpg" alt="Interstellar" onmouseover="upDate(this)" onmouseout="undo()">
    <img src="peaky.jpg" alt="Peaky Blinders" onmouseover="upDate(this)" onmouseout="undo()">
    <img src="breakingbad.jpg" alt="Breaking Bad" onmouseover="upDate(this)" onmouseout="undo()">
</div>

<script>
function upDate(previewPic) {
    const display = document.getElementById("image");
    display.innerHTML = previewPic.alt;
    display.style.backgroundImage = "url('" + previewPic.src + "')";
}

function undo() {
    const display = document.getElementById("image");
    display.innerHTML = "Hover over an image below to display here.";
    display.style.backgroundImage = "";
}
</script>

</body>
</html>
